version: 2
models:
- name: stg_mystarroom__orders
  description: 'datamart.tb_commerce_orders_flattened → vw_commerce_orders | grain:
    주문 1건'
  columns:
  - name: order_id
    data_tests:
    - not_null
  - name: order_number
    data_tests:
    - not_null
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - order_id
        - order_number
- name: stg_mystarroom__order_items
  description: 'vw_commerce_order_items | grain: 주문 × 아이템'
  data_tests:
