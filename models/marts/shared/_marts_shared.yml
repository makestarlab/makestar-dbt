version: 2

models:
  - name: time_spine_daily
    description: "일 단위 time spine. MetricFlow 최소 요구사항."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests: [unique, not_null]

  - name: time_spine_hourly
    description: "시간 단위 time spine. 이벤트 오픈 시각 분석용."
    time_spine:
      standard_granularity_column: date_hour
    columns:
      - name: date_hour
        granularity: hour
        data_tests: [unique, not_null]
